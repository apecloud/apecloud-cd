name: Manifests Charts Images Check

on:
  workflow_dispatch:
    inputs:
      MANIFESTS_FILE:
        description: "The file path to check"
        type: string
        required: true
        default: ''
      GITHUB_REPO:
        description: "The github repo to check"
        type: string
        required: false
        default: ''
      GITHUB_REF:
        description: "The github repo ref to check"
        type: string
        required: false
        default: 'main'
      APECD_REF:
        description: "The branch name of apecloud-cd"
        type: string
        required: false
        default: 'main'
      CLOUD_CHART_PATH:
        description: "Source Cloud Chart directory; empty uses the published Chart"
        type: string
        required: false
        default: ''
      CLOUD_CHART_VERSION:
        description: "Exact published Cloud version; must match the manifest and excludes source mode"
        type: string
        required: false
        default: ''
      CHECK_ENGINE_FILE:
        description: "The file path of check engine image script"
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      MANIFESTS_FILE:
        description: "The file path to check"
        type: string
        required: true
        default: ''
      GITHUB_REPO:
        description: "The github repo to check"
        type: string
        required: false
        default: ''
      GITHUB_REF:
        description: "The github repo ref to check"
        type: string
        required: false
        default: 'main'
      APECD_REF:
        description: "The branch name of apecloud-cd"
        type: string
        required: false
        default: 'main'
      CLOUD_CHART_PATH:
        description: "Source Cloud Chart directory; empty uses the published Chart"
        type: string
        required: false
        default: ''
      CLOUD_CHART_VERSION:
        description: "Exact published Cloud version; must match the manifest and excludes source mode"
        type: string
        required: false
        default: ''
      CHECK_ENGINE_FILE:
        description: "The file path of check engine image script"
        type: string
        required: false
        default: ''


run-name: check charts images

env:
  CR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
  HELM_VERSION: "v3.16.3"
  CHART_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
  CHART_ACCESS_USER: ${{ secrets.GITLAB_ACCESS_USER }}
  CHART_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
  HELM_ENTERPRISE_USERNAME: ${{ secrets.GITLAB_ACCESS_USER }}
  HELM_ENTERPRISE_PASSWORD: ${{ secrets.GITLAB_ACCESS_TOKEN }}
  PYTHON_VERSION: "3.11"

jobs:
  images-check:
    runs-on: [self-hosted, docker]
    steps:
      - name: Checkout Code
        if: ${{ inputs.GITHUB_REPO == '' }}
        uses: actions/checkout@v4

      - name: Checkout ${{ inputs.GITHUB_REPO }} Code
        if: ${{ inputs.GITHUB_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.GITHUB_REPO }}
          path: ./
          token: ${{ env.CR_TOKEN }}
          ref: ${{ inputs.GITHUB_REF }}

      - name: Checkout apecloud-cd Code
        uses: actions/checkout@v4
        with:
          repository: apecloud/apecloud-cd
          path: apecloud-cd
          token: ${{ env.CR_TOKEN }}
          ref: ${{ inputs.APECD_REF }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install pyyaml
        run: pip3 install pyyaml

      - name: manifests images check
        env:
          MANIFESTS_FILE: ${{ inputs.MANIFESTS_FILE }}
          CHECK_ENGINE_FILE: ${{ inputs.CHECK_ENGINE_FILE }}
          CLOUD_CHART_PATH: ${{ inputs.CLOUD_CHART_PATH }}
          CLOUD_CHART_VERSION: ${{ inputs.CLOUD_CHART_VERSION }}
        run: |
          MANIFESTS_FILE="${MANIFESTS_FILE:-${GITHUB_WORKSPACE}/manifests/deploy-manifests.yaml}"
          CHECK_ENGINE_FILE="${CHECK_ENGINE_FILE:-${GITHUB_WORKSPACE}/fountain/hack/check-engine-images.py}"
          if [[ -f "${CHECK_ENGINE_FILE}" ]]; then
              bash "${GITHUB_WORKSPACE}/apecloud-cd/.github/utils/manifests_charts_image_check.sh" "${MANIFESTS_FILE}" "true" "${CHECK_ENGINE_FILE}"
          else
              bash "${GITHUB_WORKSPACE}/apecloud-cd/.github/utils/manifests_charts_image_check.sh" "${MANIFESTS_FILE}"
          fi
