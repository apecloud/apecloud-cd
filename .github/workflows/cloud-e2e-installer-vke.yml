name: Cloud E2E Installer VKE

on:
  workflow_dispatch:
    inputs:
      CLOUD_VERSION:
        description: "The cloud release version (e.g. v2.3.70) "
        type: string
        required: true
        default: ''
      APECD_REF:
        description: "The branch name of apecloud-cd"
        type: string
        required: false
        default: 'main'
  workflow_call:
    inputs:
      CLOUD_VERSION:
        description: "The cloud release version (e.g. v2.3.70) "
        type: string
        required: true
        default: ''
      APECD_REF:
        description: "The branch name of apecloud-cd"
        type: string
        required: false
        default: 'main'

run-name: Cloud Installer E2e Test Version:${{ inputs.CLOUD_VERSION }}

