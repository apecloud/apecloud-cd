name: Cloud E2E Installer VKE

on:
  workflow_dispatch:
    inputs:
      CLOUD_VERSION:
        description: "The cloud release version (e.g. v2.3.70) "
        type: string
        required: true
        default: ''
      APECD_REF:
        description: "The branch name of apecloud-cd"
        type: string
        required: false
        default: 'main'
  workflow_call:
    inputs:
      CLOUD_VERSION:
        description: "The cloud release version (e.g. v2.3.70) "
        type: string
        required: true
        default: ''
      APECD_REF:
        description: "The branch name of apecloud-cd"
        type: string
        required: false
        default: 'main'

run-name: Cloud Installer E2e Test Version:${{ inputs.CLOUD_VERSION }}

env:
  GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
  VKE_KUBECONFIG: ${{ secrets.VKE_KUBECONFIG }}
  CLOUD_LICENSE: ${{ secrets.CLOUD_LICENSE }}
  CLOUD_KUBECONFIG: ${{ secrets.CLOUD_KUBECONFIG }}
  ALIYUN_REGISTRY_URL: apecloud-registry.cn-zhangjiakou.cr.aliyuncs.com
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
  KB_ADDON_SECRET_NAME: "kb-addon-test-registry-key"
  FQDN_DOMAIN: "vke.kubeblocks.com"
  CLOUD_USER_NAME: "vke-test"

