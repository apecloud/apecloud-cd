name: Cloud E2E Schedule Idc

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0' # Runs at 3:00 UTC on Mon
    - cron: '0 19 * * 1' # Runs at 3:00 UTC on Tue
    - cron: '0 19 * * 2' # Runs at 3:00 UTC on Wed
    - cron: '0 19 * * 3' # Runs at 3:00 UTC on Thu
    - cron: '0 19 * * 4' # Runs at 3:00 UTC on Fri
    - cron: '0 19 * * 5' # Runs at 3:00 UTC on Sat
    - cron: '0 19 * * 6' # Runs at 3:00 UTC on Sun

jobs:
  release-e2e-image:
    strategy:
      fail-fast: false
      matrix:
        branch-name: [ "release-2.3" ]
    uses: ./.github/workflows/release-image-no-cache.yml
    with:
      GITHUB_REPO: "apecloud/apecloud"
      GITHUB_REF: "${{ matrix.branch-name }}"
      IMG: "apecloud/e2e"
      CONTEXT: "./e2e"
      DOCKERFILE_PATH: "./e2e/Dockerfile"
      VERSION: "${{ matrix.branch-name }}"
      GO_VERSION: "1.23.1"
      REMOVE_PREFIX: false
      BUILDX_ARGS: |
        ALPINE_IMAGE=apecloud/alpine:3.16
    secrets: inherit

  release-e2e-ginkgo-image:
    strategy:
      fail-fast: false
      matrix:
        branch-name: [ "release-2.3" ]
    uses: ./.github/workflows/release-image-sync2.yml
    with:
      GITHUB_REPO: "apecloud/apecloud"
      GITHUB_REF: "${{ matrix.branch-name }}"
      MAKE_OPS: "build"
      VERSION: "${{ matrix.branch-name }}"
      GO_VERSION: "1.24.9"
      BUILDX_ENABLED: true
      GIT_CONFIG: true
      REMOVE_PREFIX: false
      MAKE_ARGS: "TARGETS=docker/e2e-ginkgo "
    secrets: inherit

  schedule-cron:
    runs-on: ubuntu-latest
    outputs:
      day-of-week: ${{ steps.get-schedule-cron.outputs.day-of-week }}
    steps:
      - name: get schedule cron
        id: get-schedule-cron
        run: |
          SCHEDULE_CRON="${{ github.event.schedule }}"
          echo "SCHEDULE_CRON:${SCHEDULE_CRON}"
          DAY_OF_WEEK="${SCHEDULE_CRON##* }"
          echo "DAY_OF_WEEK:${DAY_OF_WEEK}"
          DAY_OF_WEEK=$(( DAY_OF_WEEK + 1 ))
          echo "DAY_OF_WEEK:${DAY_OF_WEEK}"
          echo day-of-week="${DAY_OF_WEEK}" >> $GITHUB_OUTPUT

  get-test-engine:
    runs-on: ubuntu-latest
    needs: [ schedule-cron ]
    outputs:
      test-engines: ${{ steps.get_test_engine.outputs.test-engines }}
    steps:
      - name: Get test engine
        id: get_test_engine
        run: |
          TEST_INDEX="${{ needs.schedule-cron.outputs.day-of-week }}"
          TEST_ENGINES="${{ vars.KB_CLOUD_TEST_ENGINES_IDC2 }}"
          if [[ -z "$TEST_ENGINES" ]]; then
              TEST_ENGINES="mysql"
          fi
          test_engines_tmp=""
          engine_index=0
          test_job_index=0
          batched_engines=""
          for engine_tmp in $(echo "${TEST_ENGINES}" | sed 's/,/ /g' ); do
              engine_index=$(( engine_index + 1 ))
              if [[ -z "${test_engines_tmp}" ]]; then
                  test_engines_tmp="${engine_tmp}"
              else
                  test_engines_tmp="${test_engines_tmp},${engine_tmp}"
              fi

              KB_CLOUD_TEST_ENGINES_PRE="${{ vars.KB_CLOUD_TEST_ENGINES_PRE }}"
              if [[ -z "${KB_CLOUD_TEST_ENGINES_PRE}" ]]; then
                  KB_CLOUD_TEST_ENGINES_PRE=5
              fi
              if [[ $(( engine_index % ${KB_CLOUD_TEST_ENGINES_PRE} )) == 0 ]]; then
                  test_job_index=$(( test_job_index + 1 ))
                  if [[ -n "${TEST_INDEX}" && "${TEST_INDEX}" == "${test_job_index}" ]]; then
                      batched_engines="${test_engines_tmp}"
                  fi
                  test_engines_tmp=""
              fi
          done
          if [[ -n "${test_engines_tmp}" ]]; then
              test_job_index=$(( test_job_index + 1 ))
              if [[ -n "${TEST_INDEX}" && "${TEST_INDEX}" == "${test_job_index}" ]]; then
                  batched_engines="${test_engines_tmp}"
              fi
          fi
          echo "batched-engines:${batched_engines}"
          echo "test-engines=${batched_engines}" >> $GITHUB_OUTPUT

  e2e-engine-test-23-10:
    needs: [ release-e2e-image, release-e2e-ginkgo-image, schedule-cron, get-test-engine ]
    uses: ./.github/workflows/trigger-workflow.yml
    with:
      GITHUB_REPO: "apecloud/apecloud-cd"
      BRANCH_NAME: "main"
      WORKFLOW_ID: "cloud-e2e-engine.yml"
      APECD_REF: "main"
      EXTRA_ARGS: "CLOUD_TEST_ENV=idc1#CLOUD_ENV_NAME=idc2#TEST_ENGINES=${{ vars.KB_CLOUD_TEST_ENGINES_IDC2 }}#CLOUD_TEST_KB_VERSION=1.0#CLOUD_BRANCH=release-2.3#CURRENT_VERSION=v2.3#TEST_INDEX=${{ needs.schedule-cron.outputs.day-of-week }}#TEST_ENGINES_BATCH=${{ needs.get-test-engine.outputs.test-engines }}"
    secrets: inherit
