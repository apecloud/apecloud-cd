name: Manifests Images Check

on:
  workflow_dispatch:
    inputs:
      MANIFESTS_FILE:
        description: "The file path to check"
        type: string
        required: true
        default: ''
      GITHUB_REPO:
        description: "The github repo to check"
        type: string
        required: false
        default: ''
      GITHUB_REF:
        description: "The github repo ref to check"
        type: string
        required: false
        default: 'main'
      APECD_REF:
        description: "The branch name of apecloud-cd"
        type: string
        required: false
        default: 'main'
      CHECK_REGISTRY:
        description: "check registry"
        default: ''
        type: choice
        required: false
        options:
          - default
          - aliyun
          - dockerhub
      READBACK_ACR_DIGESTS:
        description: "Read only: report the approved RustFS beta.10 and kubeblocks-tools ACR digests"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      MANIFESTS_FILE:
        description: "The file path to check"
        type: string
        required: true
        default: ''
      GITHUB_REPO:
        description: "The github repo to check"
        type: string
        required: false
        default: ''
      GITHUB_REF:
        description: "The github repo ref to check"
        type: string
        required: false
        default: 'main'
      APECD_REF:
        description: "The branch name of apecloud-cd"
        type: string
        required: false
        default: 'main'
      CHECK_REGISTRY:
        description: "check registry"
        default: ''
        type: string
        required: false
      READBACK_ACR_DIGESTS:
        description: "Read only: report the approved RustFS beta.10 and kubeblocks-tools ACR digests"
        type: boolean
        required: false
        default: false

run-name: check images ${{ inputs.CHECK_REGISTRY }}

env:
  CR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
  HELM_VERSION: "v3.16.3"
  DOCKER_REGISTRY_URL: docker.io
  ALIYUN_REGISTRY_URL: apecloud-registry.cn-zhangjiakou.cr.aliyuncs.com
  DOCKER_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
  ALIYUN_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  images-check:
    if: ${{ !inputs.READBACK_ACR_DIGESTS }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        if: ${{ inputs.GITHUB_REPO == '' }}
        uses: actions/checkout@v4

      - name: Checkout ${{ inputs.GITHUB_REPO }} Code
        if: ${{ inputs.GITHUB_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.GITHUB_REPO }}
          path: ./
          token: ${{ env.CR_TOKEN }}
          ref: ${{ inputs.GITHUB_REF }}

      - name: Checkout apecloud-cd Code
        uses: actions/checkout@v4
        with:
          repository: apecloud/apecloud-cd
          path: apecloud-cd
          token: ${{ env.CR_TOKEN }}
          ref: ${{ inputs.APECD_REF }}

      - if: ${{ env.DOCKER_USER != '' && env.DOCKER_PASSWORD != '' && inputs.CHECK_REGISTRY != 'aliyun' }}
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY_URL }}
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWORD }}

      - if: ${{ env.ALIYUN_USER != '' && env.ALIYUN_PASSWORD != '' && inputs.CHECK_REGISTRY == 'aliyun' }}
        name: Login to Aliyun Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.ALIYUN_REGISTRY_URL }}
          username: ${{ env.ALIYUN_USER }}
          password: ${{ env.ALIYUN_PASSWORD }}

      - name: manifests images check
        run: |
          CHECK_REGISTRY="${{ inputs.CHECK_REGISTRY }}"
          MANIFESTS_FILE="${{ inputs.MANIFESTS_FILE }}"
          case $CHECK_REGISTRY in
              aliyun)
                  bash ${{ github.workspace }}/apecloud-cd/.github/utils/manifests_image_check.sh "${MANIFESTS_FILE}" "${{ env.ALIYUN_REGISTRY_URL }}"
              ;;
              dockerhub)
                  bash ${{ github.workspace }}/apecloud-cd/.github/utils/manifests_image_check.sh "${MANIFESTS_FILE}" "${{ env.DOCKER_REGISTRY_URL }}"
              ;;
              *)
                  bash ${{ github.workspace }}/apecloud-cd/.github/utils/manifests_image_check.sh "${MANIFESTS_FILE}"
              ;;
          esac

  acr-digest-readback:
    if: ${{ inputs.READBACK_ACR_DIGESTS }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY_URL }}
          username: ${{ env.ALIYUN_USER }}
          password: ${{ env.ALIYUN_PASSWORD }}

      - name: Read ACR manifest digests
        run: |
          bash "${{ github.workspace }}/.github/utils/read_acr_manifest_digests.sh" \
            "${{ env.ALIYUN_REGISTRY_URL }}/apecloud/rustfs/rustfs:1.0.0-beta.10" \
            "${{ env.ALIYUN_REGISTRY_URL }}/apecloud/kubeblocks-tools:1.0.0"
