name: A skopeo image to aliyun & dockerhub

on:
  workflow_dispatch:
    inputs:
      kibana_multiarch:
        description: 'Publish and verify pinned Kibana 7.10.2 amd64/arm64 images'
        type: boolean
        default: false
      verified_kibana_index:
        description: 'Index digest that passed native ARM64 smoke; empty leaves release tag unchanged'
        default: ''
      images_name:
        description: 'sync image src name (e.g. <namesapce>/<name>:<tag>)'
        required: false
        default: ''
      registry:
        description: 'sync image src registry(e.g. docker.io)'
        required: false
        default: 'docker.io'

run-name: "sync to aliyun and dockerhub: ${{ inputs.registry }}/${{ inputs.images_name }}"

env:
  DOCKER_REGISTRY_URL: docker.io
  ALIYUN_REGISTRY_URL: apecloud-registry.cn-zhangjiakou.cr.aliyuncs.com
  DOCKER_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
  ALIYUN_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
  ECR_PASSWORD: ${{ secrets.ECR_PASSWORD }}

concurrency:
  group: ${{ inputs.kibana_multiarch && 'kibana-7.10.2-publication' || github.run_id }}
  cancel-in-progress: false

jobs:
  skopeo:
    if: ${{ !inputs.kibana_multiarch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        registry: [ docker.io, apecloud-registry.cn-zhangjiakou.cr.aliyuncs.com ]
    steps:
      - uses: actions/checkout@v4
      - name: install skopeo
        run: |
          brew install skopeo
          skopeo sync -h
          if [[ -n "${{ inputs.images_name }}" ]];then
              bash ${{ github.workspace }}/.github/utils/utils.sh \
                  --type 26 \
                  --images "${{ inputs.images_name }}" \
                  --images-list ${{ github.workspace }}/.github/utils/images-list.txt
          fi

      - name: check ${{ matrix.registry }} images exists
        id: check_image_exists
        continue-on-error: true
        run: |
          SKEPEO_TOOL="copy"
          echo "skopeo-tool=${SKEPEO_TOOL}" >> $GITHUB_OUTPUT
          IMAGE_NAME="${{ inputs.images_name }}"
          IMAGE_NAME=${IMAGE_NAME##*/}
          IMAGE_NAME=${IMAGE_NAME%:*}
          LIST_IMAGE_NAME="${{ matrix.registry }}/apecloud/${IMAGE_NAME}"
          for i in {1..3}; do
              LIST_TAGS="$( skopeo list-tags docker://${LIST_IMAGE_NAME} )"
              if [[ -n "${LIST_TAGS}" ]]; then
                  SKEPEO_TOOL="sync"
                  break
              fi
              sleep 1
          done
          echo "skopeo-tool=${SKEPEO_TOOL}" >> $GITHUB_OUTPUT

      - name: skopeo sync images to dockerhub
        if: ${{ steps.check_image_exists.outputs.skopeo-tool == 'sync' && matrix.registry == 'docker.io' }}
        run: |
          bash ${{ github.workspace }}/.github/utils/skopeo_sync_to_docker.sh \
              "${{ env.DOCKER_USER }}" \
              '${{ env.DOCKER_PASSWORD }}' \
              ${{ github.workspace }}/.github/utils/images-list.txt \
              "${{ inputs.registry }}" \
              '${{ env.ECR_PASSWORD }}'

      - name: skopeo copy images to dockerhub
        if: ${{ steps.check_image_exists.outputs.skopeo-tool == 'copy' && matrix.registry == 'docker.io' }}
        run: |
          bash ${{ github.workspace }}/.github/utils/skopeo_copy_to_docker.sh \
              "${{ env.DOCKER_USER }}" \
              '${{ env.DOCKER_PASSWORD }}' \
              ${{ github.workspace }}/.github/utils/images-list.txt \
              "${{ inputs.registry }}" \
              '${{ env.ECR_PASSWORD }}'

      - name: skopeo sync images to aliyun
        if: ${{ steps.check_image_exists.outputs.skopeo-tool == 'sync' && matrix.registry == 'apecloud-registry.cn-zhangjiakou.cr.aliyuncs.com' }}
        run: |
          bash ${{ github.workspace }}/.github/utils/skopeo_sync_to_aliyun.sh \
              "${{ env.DOCKER_USER }}" \
              '${{ env.DOCKER_PASSWORD }}' \
              "${{ env.ALIYUN_USER }}" \
              "${{ env.ALIYUN_PASSWORD }}" \
              ${{ github.workspace }}/.github/utils/images-list.txt \
              "${{ inputs.registry }}"

      - name: skopeo copy images to aliyun
        if: ${{ steps.check_image_exists.outputs.skopeo-tool == 'copy' }}
        run: |
          bash ${{ github.workspace }}/.github/utils/skopeo_copy_to_aliyun.sh \
              "${{ env.ALIYUN_USER }}" \
              "${{ env.ALIYUN_PASSWORD }}" \
              ${{ github.workspace }}/.github/utils/images-list.txt \
              "${{ inputs.registry }}"

  kibana-prepare:
    if: ${{ inputs.kibana_multiarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      index_digest: ${{ steps.prepare.outputs.index_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - uses: docker/login-action@v3
        with:
          registry: apecloud-registry.cn-zhangjiakou.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - id: prepare
        run: bash .github/utils/kibana-7.10.2-multiarch.sh prepare

  kibana-smoke:
    needs: kibana-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Start Kibana with Elasticsearch 7.10.2
        env:
          TEST_ARCH: ${{ matrix.arch }}
          INDEX_DIGEST: ${{ needs.kibana-prepare.outputs.index_digest }}
        run: bash .github/utils/kibana-7.10.2-multiarch.sh smoke

  kibana-promote:
    if: ${{ inputs.verified_kibana_index != '' && inputs.verified_kibana_index == needs.kibana-prepare.outputs.index_digest }}
    needs: [kibana-prepare, kibana-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - uses: docker/login-action@v3
        with:
          registry: apecloud-registry.cn-zhangjiakou.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Promote tested index to 7.10.2 in both registries
        env:
          INDEX_DIGEST: ${{ needs.kibana-prepare.outputs.index_digest }}
        run: bash .github/utils/kibana-7.10.2-multiarch.sh promote
